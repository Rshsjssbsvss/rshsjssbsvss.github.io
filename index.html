
<!DOCTYPE html>
<html lang="bn" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MD. FARID RANA | Development + Penetration Testing</title>

    <meta name="description" content="Official personal profile of MD. FARID RANA from Gazipur, Bangladesh.">
    <meta name="author" content="MD. FARID RANA">
    <meta name="theme-color" content="#000000">

    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        blackBg: '#000000',
                        cardBg: '#080808',
                        gold: '#d4af37',
                        cyanGlow: '#00e5ff',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['Fira Code', 'monospace']
                    }
                }
            }
        }
    </script>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Fira+Code:wght@400;500;600&display=swap"
          rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background: #000000;
            color: #e5e5e5;
            font-family: 'Inter', sans-serif;
        }

        .card-dark {
            background: #080808;
            border: 1px solid #292315;
            transition: all 0.3s ease;
        }

        .card-dark:hover {
            border-color: rgba(212, 175, 55, 0.5);
            box-shadow: 0 0 25px -5px rgba(212, 175, 55, 0.15);
        }

        .profile-frame {
            width: 160px;
            height: 160px;
            padding: 4px;
            border-radius: 22px;
            background: linear-gradient(
                145deg,
                #f5d76e,
                #d4af37,
                #292315
            );
            box-shadow: 0 10px 35px rgba(212, 175, 55, 0.15);
        }

        .profile-photo {
            display: block;
            width: 100%;
            height: 100%;
            border-radius: 18px;
            object-fit: cover;
            object-position: center 25%;
            background: #ffffff;
        }

        @media (min-width: 640px) {
            .profile-frame {
                width: 208px;
                height: 208px;
            }
        }
    </style>
</head>

<body class="bg-blackBg text-gray-200 antialiased min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="px-6 lg:px-12 py-6 border-b border-zinc-900/60">
        <div class="max-w-4xl mx-auto flex items-center justify-between">

            <div class="flex items-center gap-2">
                <span class="w-2.5 h-2.5 rounded-full bg-gold animate-pulse"></span>

                <span class="font-mono text-sm font-bold tracking-widest text-white">
                    FARID RANA
                </span>
            </div>

            <span class="text-xs font-mono text-zinc-500">
                Gazipur, BD
            </span>

        </div>
    </header>

    <!-- Main -->
    <main class="max-w-4xl mx-auto px-5 sm:px-6 w-full py-12 flex-1 flex items-center justify-center">

        <div class="card-dark w-full p-7 sm:p-12 rounded-3xl relative">

            <div class="flex flex-col-reverse md:flex-row items-center md:items-start justify-between gap-10">

                <!-- Profile Information -->
                <div class="space-y-6 text-center md:text-left flex-1">

                    <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-zinc-950 border border-zinc-800 text-gold text-xs font-mono">
                        <i class="fa-solid fa-terminal text-[10px]"></i>
                        VOID SOCIETY
                    </div>

                    <div>
                        <h1 class="text-3xl sm:text-5xl font-extrabold text-white tracking-tight">
                            MD. FARID RANA
                        </h1>

                        <p class="text-lg sm:text-2xl font-mono text-gold mt-3 font-semibold tracking-wide">
                            Development + Penetration Testing
                        </p>
                    </div>

                    <p class="text-gray-400 text-sm max-w-md leading-relaxed font-light">
                        Exploring software architectures, Linux kernel mechanisms, and proactive cyber security research.
                    </p>

                    <div class="pt-2 flex flex-wrap items-center justify-center md:justify-start gap-4 text-xs font-mono text-zinc-500">

                        <span class="flex items-center gap-1.5">
                            <i class="fa-solid fa-location-dot text-gold"></i>
                            Gazipur, Bangladesh
                        </span>

                        <span>•</span>

                        <span class="flex items-center gap-1.5 text-zinc-400">
                            <i class="fa-solid fa-shield-halved text-cyanGlow"></i>
                            Security Research
                        </span>

                    </div>
                </div>

                <!-- Profile Picture -->
                <div class="flex-shrink-0 relative">

                    <div class="profile-frame">

                        <img
                            src="./profile.jpg"
                            alt="MD. FARID RANA Profile Photo"
                            class="profile-photo"
                            width="208"
                            height="208"
                            loading="eager"
                            decoding="async"
                            fetchpriority="high"
                            onerror="this.onerror=null; this.src='https://placehold.co/400x400/080808/d4af37?text=FARID+RANA';"
                        >

                    </div>

                    <div class="absolute -bottom-2 -right-2 px-3 py-1 bg-black border border-gold/50 rounded text-[11px] font-mono text-gold">
                        Mr. Hacker
                    </div>

                </div>

            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="py-6 bg-black border-t border-zinc-900/60 text-center text-xs text-zinc-600 font-mono">
        © 2026 MD. FARID RANA
    </footer>

</body>
</html>
